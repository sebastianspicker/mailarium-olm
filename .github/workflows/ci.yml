name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pull-request:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14.6"
      - name: Install dependencies
        run: |
          python -m pip install "uv==0.10.7"
          uv sync --locked --extra dev --extra nlp --extra training --extra ews-ntlm
      - name: Run pull-request verification profile
        run: uv run python scripts/verify.py pr

  release-package:
    needs: pull-request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14.6"
      - name: Install dependencies
        run: |
          python -m pip install "uv==0.10.7"
          uv sync --locked --extra dev --extra nlp --extra training --extra ews-ntlm
      - name: Run release verification profile
        run: uv run python scripts/verify.py release

  supported-macos-smoke:
    name: macOS 14 ARM64 package smoke
    needs: pull-request
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14.6"
      - name: Verify supported architecture
        run: python -c "import platform; assert platform.machine() == 'arm64', platform.machine()"
      - name: Install dependencies
        run: |
          python -m pip install "uv==0.10.7"
          uv sync --locked --extra dev --extra ews-ntlm
      - name: Run release verification profile
        run: uv run python scripts/verify.py release
