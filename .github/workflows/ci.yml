name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pull-request:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"
      - name: Install dependencies
        run: |
          python -m pip install "uv==0.10.7"
          uv sync --locked --extra dev --extra nlp --extra training --extra ews-ntlm
      - name: Run pull-request verification profile
        run: uv run python scripts/verify.py pr

  release-package:
    needs: pull-request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"
      - name: Install dependencies
        run: |
          python -m pip install "uv==0.10.7"
          uv sync --locked --extra dev --extra nlp --extra training --extra ews-ntlm
      - name: Verify release package after the PR profile
        run: uv run python scripts/verify.py package

  supported-macos-smoke:
    name: macOS 14 ARM64 package smoke
    needs: pull-request
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"
      - name: Verify supported architecture
        run: python -c "import platform; assert platform.machine() == 'arm64', platform.machine()"
      - name: Install dependencies
        run: |
          python -m pip install "uv==0.10.7"
          uv sync --locked --extra dev --extra ews-ntlm
      - name: Run release verification profile
        run: uv run python scripts/verify.py release
