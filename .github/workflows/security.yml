name: Security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.6"
      - name: Install security tooling
        run: python -m pip install "uv==0.10.7" "pip-audit==2.10.1" "bandit==1.9.4"
      - name: Audit locked dependencies without advisory exemptions
        run: python scripts/release/dependency_audit.py
      - name: Scan source and publication privacy tools
        run: python -m bandit -r mailarium scripts/release/privacy -q -ll -ii
