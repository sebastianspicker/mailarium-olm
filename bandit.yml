# Bandit configuration for Codacy static analysis.
# Codacy picks up bandit.yml at the repository root.
# https://docs.codacy.com/repositories-configure/configuring-code-patterns/

skips:
  # B101: assert_used; pytest relies on `assert` for test assertions.
  # 6,946 instances in tests/, zero non-test rationale to keep this enabled.
  - B101

  # B608: hardcoded_sql_expressions; all 32 findings across 13 DB/query files
  # use f-strings for structural SQL composition (dynamic WHERE clauses with
  # conditional filters, IN-clause placeholder generation, validated ORDER BY
  # columns), but every value is bound via `?` parameters. Validation guards:
  #   - _validate_sql_identifiers() for column names (email_db.py)
  #   - _validate_order_by() for sort columns (db_queries_browse.py)
  #   - _validate_column_update_pairs() for SET columns (db_evidence.py)
  #   - _sql_in_placeholders() generates pure ?,?,... strings
  #   - _escape_like() protects LIKE wildcards (qa_eval_live.py fixed 2026-06-04)
  # No user input becomes SQL syntax in any finding.
  # Validated 2026-06-04: fresh code-context review of all 13 files.
  - B608

  # B603 / B607: subprocess safety; 22 B603 + 6 B607 findings across 7
  # runtime/script files.  All subprocess calls use list-form arguments (no
  # shell=True).  Executables resolved via:
  #   - shutil.which() or "git" fallback (privacy_scan.py, repo_paths.py)
  #   - sys.executable for Python re-exec (dependency_audit.py, run_qa_eval.py,
  #     streamlit_smoke.py, ingest.py)
  #   - shutil.which() for Tesseract/pdftoppm (attachment_extractor.py)
  # No user input reaches subprocess command lists; env-var-derived arguments
  # are validated (OCR PSM integer 0-13, PDF max pages integer 1-50,
  # OCR lang stripped + whitespace-rejected).
  # Validated 2026-06-04: repo_paths.py shutil.which audit, lang_hint sanitization.
  - B603
  - B607

  # B110: try_except_pass; 8 findings across email_db.py, ingest_pipeline.py,
  # mcp_server.py.  Five bare-pass teardown handlers narrowed to specific
  # exception types (OSError, sqlite3.Error, ValueError) on 2026-06-04.
  # Remaining cases already log (ingest_pipeline.py abort fallback with
  # logger.warning) or capture the exception via `as exc` for comparison.
  # All are best-effort teardown / resource-release paths where propagating
  # the exception would be worse than swallowing it.
  - B110
