<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Retrieval scope and adaptive weighting explainer</title>
  <desc id="desc">Documentation explainer combining the current search-mode controls with retrieval diagnostics returned by the search pipeline.</desc>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <rect x="70" y="62" width="1060" height="556" rx="18" fill="#fff" stroke="#e2e8f0"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" fill="#0f172a">
    <text x="120" y="120" font-size="12" font-weight="700" fill="#2563eb" letter-spacing="1.5">RETRIEVAL POLICY EXPLAINER</text>
    <text x="120" y="164" font-size="30" font-weight="700">Scope is explicit; retrieval weights adapt to query shape</text>
    <text x="120" y="199" font-size="15" fill="#475569">Users can supply any business context. The policy adapts semantic and keyword weights to query shape.</text>
    <text x="120" y="222" font-size="15" fill="#475569">Sparse retrieval and reranking remain user-controlled modes; searches do not train the model.</text>
    <text x="120" y="250" font-size="13" font-weight="700" fill="#334155">Search Mode</text>
    <g>
      <rect x="120" y="266" width="292" height="94" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="454" y="266" width="292" height="94" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="788" y="266" width="292" height="94" rx="10" fill="#fff" stroke="#cbd5e1"/>
      <rect x="142" y="291" width="17" height="17" rx="3" fill="#fff" stroke="#64748b"/><rect x="476" y="291" width="17" height="17" rx="3" fill="#fff" stroke="#64748b"/><rect x="810" y="291" width="17" height="17" rx="3" fill="#fff" stroke="#64748b"/>
      <text x="171" y="306" font-size="15" font-weight="700">Hybrid search</text><text x="505" y="306" font-size="15" font-weight="700">Re-rank results</text><text x="839" y="306" font-size="15" font-weight="700">Expand query</text>
      <text x="142" y="335" font-size="12" fill="#64748b">Fuse semantic and lexical candidates.</text><text x="476" y="335" font-size="12" fill="#64748b">Improve final ordering when enabled.</text><text x="810" y="335" font-size="12" fill="#64748b">Broaden recall with related terms.</text>
    </g>
    <rect x="120" y="398" width="960" height="150" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="148" y="435" font-size="13" font-weight="700">Retrieval Scope</text>
    <rect x="148" y="448" width="338" height="44" rx="8" fill="#fff" stroke="#94a3b8"/>
    <text x="164" y="476" font-size="14" fill="#334155">customer support</text>
    <text x="550" y="437" font-size="15" font-weight="700" fill="#1e3a8a">Example diagnostics returned after search</text>
    <text x="550" y="463" font-size="13" fill="#1e3a8a">Question-like or longer phrasing favors semantic context. Quoted phrases,</text>
    <text x="550" y="484" font-size="13" fill="#1e3a8a">email addresses, filenames, and identifiers increase keyword weight.</text>
    <rect x="550" y="503" width="110" height="26" rx="13" fill="#dbeafe"/><rect x="670" y="503" width="164" height="26" rx="13" fill="#dbeafe"/><rect x="844" y="503" width="126" height="26" rx="13" fill="#dbeafe"/>
    <text x="565" y="521" font-size="11" fill="#1d4ed8">scope_explicit</text><text x="684" y="521" font-size="11" fill="#1d4ed8">semantic_query_shape</text><text x="858" y="521" font-size="11" fill="#1d4ed8">semantic=0.70</text>
    <text x="120" y="582" font-size="12" fill="#94a3b8">Documentation explainer · not a literal Streamlit capture · synthetic data only</text>
  </g>
</svg>
