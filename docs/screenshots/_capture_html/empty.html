<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Mailarium empty archive</title>
<style>
:root {
  --navy:#073760; --accent:#0b63ce; --ink:#172331; --ink-2:#475466; --ink-3:#6f7a88;
  --line:#e2e6eb; --line-2:#cbd2da; --surface:#f7f9fc; --white:#fff; --ok-dot:#f47a20;
  --warn-bg:#fff8e6; --warn-border:#f0e0a8; --warn-ink:#7a5b00;
  --info-bg:#eef5fc; --info-border:#c5daf0; --info-ink:#172331;
  --font: Inter, "Avenir Next", ui-sans-serif, system-ui, sans-serif;
  --display: "Avenir Next Condensed", "Arial Narrow", Inter, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin:0; width:1440px; height:900px; overflow:hidden; font-family:var(--font); color:var(--ink); background:var(--white); }
.app { display:grid; grid-template-columns:172px 1fr; height:900px; }
.rail { background:var(--navy); color:#fff; display:flex; flex-direction:column; padding:22px 0 16px; }
.lockup { padding:4px 20px 24px; border-bottom:1px solid rgba(255,255,255,.12); font-family:var(--display); font-size:1.15rem; letter-spacing:.12em; font-weight:500; }
.nav button { display:flex; align-items:center; gap:10px; width:100%; min-height:54px; padding:10px 18px; border:0; border-left:3px solid transparent; background:transparent; color:rgba(255,255,255,.88); font:inherit; font-size:.9rem; text-align:left; }
.nav button::before { content:"—"; width:14px; color:rgba(255,255,255,.55); }
.nav button.active { background:rgba(11,99,206,.55); border-left-color:#35a2ff; color:#fff; }
.nav button.active::before { color:#35a2ff; }
.runtime { margin-top:auto; padding:16px 18px 4px; border-top:1px solid rgba(255,255,255,.15); display:grid; grid-template-columns:auto 1fr; gap:2px 8px; align-items:center; font-size:12px; }
.runtime i { width:8px; height:8px; border-radius:50%; background:var(--ok-dot); }
.runtime small { grid-column:2; color:rgba(255,255,255,.58); font-size:11px; }
.main { padding:0; }
.heading { padding:28px 30px 8px; }
.heading h1 { margin:0; font-family:var(--display); font-size:2.5rem; font-weight:500; letter-spacing:-.03em; line-height:1.05; }
.alert { margin:16px 30px 0; padding:14px 16px; border-radius:6px; font-size:.95rem; line-height:1.45; }
.alert.warn { background:var(--warn-bg); border:1px solid var(--warn-border); color:var(--warn-ink); }
.alert.info { background:var(--info-bg); border:1px solid var(--info-border); color:var(--info-ink); }
.alert code { display:block; margin:10px 0; padding:10px 12px; background:rgba(255,255,255,.7); border-radius:4px; font-family:ui-monospace, monospace; font-size:.88rem; color:var(--ink); }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="lockup">MAILARIUM</div>
    <nav class="nav">
      <button class="active" type="button">Search</button>
      <button type="button">Overview</button>
      <button type="button">People</button>
      <button type="button">Connections</button>
      <button type="button">Evidence</button>
      <button type="button">Mailbox</button>
    </nav>
    <div class="runtime"><i></i><span>Local archive ready</span><small>Runtime paths validated</small></div>
  </aside>
  <main class="main">
    <div class="heading"><h1>Search the archive</h1></div>
    <div class="alert warn">No emails indexed yet.</div>
    <div class="alert info">
      To index your Outlook archive, run the ingestion script:
      <code>python -m mailarium.ingest path/to/export.olm</code>
      Or use the <strong>email_ingest</strong> MCP tool directly from your MCP client.
    </div>
  </main>
</div>
</body>
</html>
