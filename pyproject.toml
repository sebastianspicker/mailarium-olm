[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mailarium"
version = "0.5.0a1"
description = "Local Outlook .olm indexing and search with CLI, MCP, and Streamlit interfaces"
readme = "README.md"
requires-python = ">=3.14.6,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mailarium contributors" }]
keywords = ["mailarium", "outlook", "email", "rag", "mcp", "local-first", "semantic-search", "retrieval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Information Technology",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "numpy==2.4.4",
    "scikit-learn==1.8.0",
    "numkong==7.8.1",
    "usearch==2.26.1",
    "torch==2.13.0",
    "sentence-transformers==5.6.0",
    "transformers==5.13.0",
    "mcp[cli]>=1.28.1",
    "pydantic>=2.4.0",
    "lxml>=6.1.0",
    "networkx>=3.2",
    "pandas>=2.1.0",
    "rank_bm25>=0.2.2",
    "jinja2>=3.1.6",
    "textstat>=0.7.0",
    "python-dotenv>=1.2.2",
    "rich>=13.0.0",
    "streamlit>=1.54.0",
    # Security: minimum versions for transitive deps with known CVEs
    "PyJWT>=2.13.0",  # CVE-2026-48522 through CVE-2026-48526 (required by mcp)
    "tornado>=6.5.7",  # CVE-2026-49853 through CVE-2026-49855 (required by streamlit)
    "aiohttp>=3.14.3",  # Security floor (required by mcp http extra)
    "cryptography>=50.0.0",  # Security floor (required by multiple deps)
    "GitPython>=3.1.58",  # Security floor (required by streamlit)
    "pillow>=12.3.0",  # PYSEC-2026-2253 to -2257 and -3451 to -3453
    "pygments>=2.20.0",  # CVE-2026-4539 (required by rich)
    "python-multipart>=0.0.31",  # CVE-2026-42561 and CVE-2026-53537 through CVE-2026-53540
    "requests>=2.33.0",  # CVE-2026-25645 (required by multiple deps)
    "nltk>=3.10.2",  # Security floor for textstat's transitive dependency
]

[project.urls]
Homepage = "https://github.com/sebastianspicker/mailarium"
Repository = "https://github.com/sebastianspicker/mailarium"
Issues = "https://github.com/sebastianspicker/mailarium/issues"
Documentation = "https://github.com/sebastianspicker/mailarium/tree/main/docs"
Changelog = "https://github.com/sebastianspicker/mailarium/blob/main/CHANGELOG.md"
Security = "https://github.com/sebastianspicker/mailarium/blob/main/SECURITY.md"

[project.optional-dependencies]
nlp = [
    "spacy==3.8.13",
]
training = [
    "datasets==5.0.1",
    "accelerate==1.14.0",
]
ews = [
    "defusedxml>=0.7.1,<1",
]
ews-ntlm = [
    "defusedxml>=0.7.1,<1",
    "requests-ntlm>=1.3.0,<2",
]
dev = [
    "pytest>=9.0.3",  # CVE-2025-71176 fixed in 9.0.3
    "coverage>=7.13.0",
    "ruff>=0.14.0",
    "mypy>=1.11.0",
    "lxml-stubs>=0.5.0",
    "bandit>=1.7.10",
    "pip-audit>=2.8.0",
]

[project.scripts]
mailarium-ingest = "mailarium.ingest:main"
mailarium = "mailarium.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mailarium*"]

[tool.setuptools.package-data]
mailarium = ["templates/*.html", "templates/dossier/*.html"]

[tool.ruff]
line-length = 130
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF", "C4", "C90", "PIE", "T20", "PLC", "PLE"]
ignore = [
    "SIM102",  # collapsible-if - nested ifs often clearer than combined conditions
    "SIM105",  # suppressible-exception - contextlib.suppress less explicit than try/except
    "SIM108",  # if-else-ternary - multi-line ternaries hurt readability
    "SIM115",  # open-file-with-context - some opens are intentionally long-lived (lock fds)
    "SIM117",  # multiple-with - combined with-statements reduce readability for complex CMs
    "PLC0415",  # import-outside-top-level - lazy imports used for optional deps throughout
    "T201",  # print - CLI uses print for user output intentionally
    "RUF001",  # ambiguous-unicode - email content contains legitimate non-ASCII chars
    "RUF002",  # ambiguous-unicode-docstring
    "RUF003",  # ambiguous-unicode-comment
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Flat-flag usage is deprecated\\..*:DeprecationWarning",
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[tool.mypy]
python_version = "3.14"
files = ["mailarium"]
pretty = true
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mailarium.ingestion.attachment_extractor_text"]
check_untyped_defs = true
